<!-- To do app will be having the following features :
list - to show all the todos
add - to add a note
delete - to delete a task 
quit - to exit the to do  -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do</title>
</head>

<body>
    <h1>To Do App</h1>
    <h3>Enter "List" to show all tasks</h3>
    <h3>Enter "add" to add a task</h3>
    <h3>Enter "delete" to remove a task</h3>
    <h3>Enter "quit" to exit the todo</h3>

    


<script src="app.js"></script>
</body>
</html>
